name: camp_management
description: Camp Management Flutter App - نظام إدارة المخيمات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests لـ Laravel API
  http: ^1.2.0

  # التخزين المحلي (حفظ التوكن)
  shared_preferences: ^2.2.3

  # الخريطة
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # الخطوط العربية
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.6

  file_picker: ^8.0.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/app_icon.png"